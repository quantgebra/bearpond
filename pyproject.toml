[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearpond"
version = "0.1.0"
description = "Simple transactional data server and sync client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bearpond = "bearpond.client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bearpond = ["server/static/**/*", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lets the test suite import bearpond straight from src/ without an editable install
pythonpath = ["src"]
