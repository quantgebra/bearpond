name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml

      # the packages depend on each other and only bearpond-protocol is needed by both sides, so install all three together
      - name: Install packages
        run: python -m pip install -e packages/protocol -e packages/server -e packages/client -e "packages/auth[dev]" pytest

      - name: Run tests
        run: python -m pytest

  build:
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # each package carries its own copy of the license files, so a stale copy would ship the wrong text
      - name: Check license file copies
        run: |
          for package in protocol server client auth; do
            cmp LICENSE "packages/$package/LICENSE"
            cmp NOTICE "packages/$package/NOTICE"
          done

      - name: Build distributions
        run: |
          python -m pip install build
          for package in protocol server client auth; do
            python -m build --outdir dist "packages/$package"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
