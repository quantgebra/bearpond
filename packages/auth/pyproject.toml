[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantgebra-auth"
version = "0.1.0"
description = "Local and OIDC authentication, sessions, groups and grant rules for quantgebra's Python services"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0.45",
    "alembic>=1.17",
    "argon2-cffi>=23.1",
    "joserfc>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.121",
]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.121",
    "psycopg[binary]>=3.2",
    "testcontainers[postgres]>=4.13",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
quantgebra = ["auth/py.typed", "auth/migrations/script.py.mako"]
