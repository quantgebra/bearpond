[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bearpond"
version = "0.1.0"
description = "Simple transactional data sync client"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = [
    "bearpond-protocol",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "bearpond-server",
    "pytest>=8.0",
]

[project.scripts]
bearpond = "bearpond.client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
