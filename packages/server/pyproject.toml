[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bearpond-server"
version = "0.1.0"
description = "bearpond's transactional data server"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = [
    "bearpond-protocol",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
bearpond = ["server/static/**/*", "server/static/*"]
