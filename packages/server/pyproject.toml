[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bearpond-server"
version = "0.1.0"
description = "bearpond's transactional data server"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = [
    "bearpond-protocol",
    "quantgebra-auth[fastapi]",
    "sqlalchemy>=2.0.45",
    "alembic>=1.17",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = [
    "quantgebra-auth[postgres]",
]
dev = [
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
bearpond = [
    "server/ui/templates/*.html",
    "server/ui/templates/icons/*.svg",
    "server/ui/static/*",
    "server/py.typed",
    "server/migrations/script.py.mako",
]
