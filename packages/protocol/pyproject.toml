[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearpond-protocol"
version = "0.1.0"
description = "Shared wire-format types for bearpond's client and server"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
