[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bearpond-protocol"
version = "0.1.0"
description = "Shared wire-format types for bearpond's client and server"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
